[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "UP", "I", "S"]
# E,F = errores base | B = bugbear (bugs reales) | SIM = simplificaciones
# UP  = sintaxis moderna | I = imports ordenados | S = seguridad (bandit)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q --cov=traductor.latencia --cov=traductor.audio.virtual --cov=traductor.traduccion --cov=traductor.ui --cov=traductor.tts --cov=traductor.asr --cov=traductor.flujo --cov=traductor.hardware --cov=setup_dlls --cov-report=term-missing --cov-fail-under=90"

[project]
name = "traductor-voz-entrevistas"
version = "0.1.0"
dependencies = []

[tool.mutmut]
source_paths = ["src/traductor/", "setup_dlls.py"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["--no-cov"]
mutate_only_covered_lines = true
# setup_dlls.py vive en la raíz (se corre como script): copiarlo al dir mutants
also_copy = ["setup_dlls.py"]
